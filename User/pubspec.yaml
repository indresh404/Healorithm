name: healorithm
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── Animations ────────────────────────────────────────────────────────────
  lottie: ^3.1.2
  visibility_detector: ^0.4.0
  animate_do: ^3.3.4
  smooth_page_indicator: ^1.1.0

  # ── UI / Icons ────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # ── QR ────────────────────────────────────────────────────────────────────
  qr_flutter: ^4.1.0

  # ── Backend / Auth ────────────────────────────────────────────────────────
  supabase_flutter: ^2.5.0
  crypto: ^3.0.3

  # ── Location ──────────────────────────────────────────────────────────────
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # ── AI / Voice (NEW) ──────────────────────────────────────────────────────
  google_generative_ai: ^0.4.6       # Gemini 2.0 Flash
  speech_to_text: ^7.0.0             # Microphone → text (STT)
  flutter_tts: ^4.2.2                # Text → speech (TTS)

  # ── Offline Storage + Sync (NEW) ─────────────────────────────────────────
  sqflite: ^2.3.3+1                  # Local SQLite database
  path: ^1.9.0                       # DB file path helper
  connectivity_plus: ^6.1.1          # Detect online/offline state
  uuid: ^4.5.1                       # Generate unique session/record IDs
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/